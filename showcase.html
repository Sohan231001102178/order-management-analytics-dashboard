<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --secondary: #0d9488;
      --status-completed-text: #15803d;
      --status-completed-bg: #dcfce7;
      --status-completed-border: #bbf7d0;
      --status-completed-dot: #16a34a;
      --status-processing-text: #1d4ed8;
      --status-processing-bg: #dbeafe;
      --status-processing-border: #bfdbfe;
      --status-processing-dot: #2563eb;
      --status-pending-text: #b45309;
      --status-pending-bg: #fef3c7;
      --status-pending-border: #fde68a;
      --status-pending-dot: #d97706;
      --status-cancelled-text: #b91c1c;
      --status-cancelled-bg: #fee2e2;
      --status-cancelled-border: #fecaca;
      --status-cancelled-dot: #dc2626;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px 24px 60px 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.02);
      transition: all 0.2s ease-in-out;
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    /* Masthead */
    .masthead {
      padding: 24px 28px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 50%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .brand-sub {
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 0.825rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
      border: 1px solid transparent;
      outline: none;
    }

    .btn-outline {
      background: #fff;
      border-color: var(--border-color);
      color: #334155;
    }

    .btn-outline:hover:not(:disabled) {
      background: #f8fafc;
      border-color: var(--border-hover);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      border: 1px solid var(--border-color);
      font-size: 0.775rem;
      font-weight: 600;
      color: #475569;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    /* Filter Controls */
    .filter-bar {
      padding: 20px 24px;
      margin-bottom: 24px;
    }

    .filter-row-top {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
    }

    .search-input-wrap {
      flex: 1.5;
      min-width: 260px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: #f8fafc;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .search-input:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }

    .select-wrap {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .select-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .select-ctrl {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: #fff;
      font-size: 0.85rem;
      color: var(--text-main);
      outline: none;
      font-family: inherit;
      cursor: pointer;
    }

    .select-ctrl:focus {
      border-color: var(--primary);
    }

    .filter-row-bottom {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1024px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .kpi-grid {
        grid-template-columns: 1fr;
      }
    }

    .kpi-card {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.05);
    }

    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .kpi-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .trend-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.725rem;
      font-weight: 600;
    }

    .trend-pill.positive {
      background: var(--status-completed-bg);
      color: var(--status-completed-text);
      border: 1px solid var(--status-completed-border);
    }

    .trend-pill.negative {
      background: var(--status-cancelled-bg);
      color: var(--status-cancelled-text);
      border: 1px solid var(--status-cancelled-border);
    }

    .kpi-value {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .kpi-footer {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kpi-icon-wrap {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kpi-subtext {
      font-size: 0.775rem;
      color: var(--text-muted);
    }

    /* Analytics Charts Tier (8:4 split) */
    .analytics-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 1024px) {
      .analytics-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .chart-title-wrap h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-title-wrap p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .chart-legend-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.775rem;
      font-weight: 600;
      color: #475569;
    }

    .legend-bar {
      width: 12px;
      height: 4px;
      border-radius: 2px;
    }

    .donut-center-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
    }

    .donut-center-num {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }

    .donut-center-lbl {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    /* Ledger Table */
    .table-card {
      overflow: hidden;
    }

    .table-header-mast {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #f8fafc;
      padding: 12px 18px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      user-select: none;
      cursor: pointer;
    }

    th:hover {
      color: var(--text-main);
    }

    th.num, td.num {
      text-align: right;
    }

    td {
      padding: 14px 18px;
      font-size: 0.85rem;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 0.725rem;
      font-weight: 600;
    }

    .status-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .cat-chip {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.725rem;
      font-weight: 600;
    }

    /* Table Pagination */
    .pagination-bar {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #fff;
    }

    .pagination-ctrls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>

      { id: 'ORD-9831', customerName: 'Walter White', customerEmail: 'ww@albuquerque-chem.edu', category: 'Software', amount: 1750.00, quantity: 2, status: 'Completed', daysAgo: 40, items: ['Spectrometry Analysis Pro'] },
      { id: 'ORD-9832', customerName: 'Jesse Pinkman', customerEmail: 'jesse@chili-p.com', category: 'Electronics', amount: 720.00, quantity: 2, status: 'Cancelled', daysAgo: 43, items: ['Studio Boom Subwoofer'] },
      { id: 'ORD-9833', customerName: 'Arya Stark', customerEmail: 'arya@winterfell.north', category: 'Apparel', amount: 290.00, quantity: 2, status: 'Completed', daysAgo: 45, items: ['Fleece Lined Winter Cloak'] },
      { id: 'ORD-9834', customerName: 'Tyrion Lannister', customerEmail: 'tyrion@casterlyrock.gov', category: 'Home', amount: 1420.00, quantity: 3, status: 'Completed', daysAgo: 48, items: ['Solid Mahogany Wine Rack'] },
      { id: 'ORD-9835', customerName: 'Ada Lovelace', customerEmail: 'ada@analytical-engine.org', category: 'Software', amount: 2900.00, quantity: 4, status: 'Completed', daysAgo: 52, items: ['Bernoulli Simulation Algorithm'] },
      { id: 'ORD-9836', customerName: 'Tony Stark', customerEmail: 'tony@starkindustries.com', category: 'Electronics', amount: 3890.00, quantity: 5, status: 'Completed', daysAgo: 55, items: ['Arc Reactor Telemetry'] },
      { id: 'ORD-9837', customerName: 'Natasha Romanoff', customerEmail: 'natasha@avengers.gov', category: 'Apparel', amount: 510.00, quantity: 3, status: 'Processing', daysAgo: 58, items: ['Ballistic Vest Liner'] },
      { id: 'ORD-9838', customerName: 'Steve Rogers', customerEmail: 'steve@brooklyn1941.mil', category: 'Home', amount: 380.00, quantity: 2, status: 'Completed', daysAgo: 62, items: ['Classic Hardwood Bench'] },
      { id: 'ORD-9839', customerName: 'Wanda Maximoff', customerEmail: 'wanda@westview.nj', category: 'Home', amount: 650.00, quantity: 4, status: 'Completed', daysAgo: 66, items: ['Mid-Century Ceramic Lamp'] },
      { id: 'ORD-9840', customerName: 'Stephen Strange', customerEmail: 'strange@sanctum.ny', category: 'Software', amount: 1980.00, quantity: 2, status: 'Completed', daysAgo: 70, items: ['Dimensional Mapping Engine'] },
      { id: 'ORD-9841', customerName: 'Carol Danvers', customerEmail: 'carol@starforce.space', category: 'Electronics', amount: 2150.00, quantity: 3, status: 'Completed', daysAgo: 73, items: ['Hyperspace Communicator'] },
      { id: 'ORD-9842', customerName: 'Scott Lang', customerEmail: 'scott@x-con-security.biz', category: 'Home', amount: 490.00, quantity: 1, status: 'Pending', daysAgo: 76, items: ['Smart Digital Safe'] },
      { id: 'ORD-9843', customerName: 'Hope van Dyne', customerEmail: 'hope@pymtech.com', category: 'Electronics', amount: 3100.00, quantity: 4, status: 'Completed', daysAgo: 79, items: ['Quantum Particle Sensor'] },
      { id: 'ORD-9844', customerName: 'Bucky Barnes', customerEmail: 'bucky@shield-ops.gov', category: 'Apparel', amount: 340.00, quantity: 2, status: 'Processing', daysAgo: 82, items: ['Tactical Leather Gloves'] },
      { id: 'ORD-9845', customerName: 'Sam Wilson', customerEmail: 'sam@falcon-flight.org', category: 'Electronics', amount: 1820.00, quantity: 2, status: 'Completed', daysAgo: 84, items: ['Carbon Fiber Drone Rig'] },
      { id: 'ORD-9846', customerName: 'Charles Xavier', customerEmail: 'charles@xavier-school.edu', category: 'Software', amount: 4200.00, quantity: 6, status: 'Completed', daysAgo: 86, items: ['Cerebro Neural Network V4'] },
      { id: 'ORD-9847', customerName: 'Erik Lehnsherr', customerEmail: 'erik@genosha-council.net', category: 'Home', amount: 980.00, quantity: 2, status: 'Cancelled', daysAgo: 87, items: ['Magnetic Audio Turntable'] },
      { id: 'ORD-9848', customerName: 'Jean Grey', customerEmail: 'jean@phoenix-found.org', category: 'Apparel', amount: 480.00, quantity: 3, status: 'Completed', daysAgo: 88, items: ['Crimson Cashmere Coat'] },
      { id: 'ORD-9849', customerName: 'Logan Howlett', customerEmail: 'logan@weapon-x.ca', category: 'Apparel', amount: 620.00, quantity: 2, status: 'Completed', daysAgo: 89, items: ['Buffalo Leather Jacket'] },
      { id: 'ORD-9850', customerName: 'Hank McCoy', customerEmail: 'hank@biogen-institute.org', category: 'Electronics', amount: 2750.00, quantity: 3, status: 'Completed', daysAgo: 90, items: ['Digital Thermal Cycler'] }
    ].map(o => {
      const d = new Date();
      d.setDate(d.getDate() - o.daysAgo);
      return {
        ...o,
        date: d.toISOString(),
        dateFormatted: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        chartLabel: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      };
    });

    // Formatters
    const fmtCurrency = (n) => `$${Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const fmtNumber = (n) => Number(n || 0).toLocaleString('en-US');

    function App() {
      const [filters, setFilters] = useState({
        dateRange: '30d',
        category: 'ALL',
        statuses: ['Completed', 'Processing', 'Pending', 'Cancelled'],
        searchQuery: ''
      });
      const [sortField, setSortField] = useState('daysAgo');
      const [sortDir, setSortDir] = useState('asc'); // asc = newest first (least days ago)
      const [page, setPage] = useState(0);
      const [rowsPerPage, setRowsPerPage] = useState(5);
      const [toast, setToast] = useState(null);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // Pipeline Step 1: Filter
      const filteredOrders = useMemo(() => {
        const { dateRange, category, statuses, searchQuery } = filters;
        const maxDays = dateRange === '7d' ? 7 : (dateRange === '30d' ? 30 : (dateRange === '90d' ? 90 : 999));
        const q = searchQuery.trim().toLowerCase();

        return RAW_ORDERS.filter(o => {
          if (o.daysAgo > maxDays) return false;
          if (category !== 'ALL' && o.category !== category) return false;
          if (!statuses.includes(o.status)) return false;
          if (q) {
            const matchId = o.id.toLowerCase().includes(q);
            const matchName = o.customerName.toLowerCase().includes(q);
            const matchEmail = o.customerEmail.toLowerCase().includes(q);
            const matchItem = o.items.some(i => i.toLowerCase().includes(q));
            if (!matchId && !matchName && !matchEmail && !matchItem) return false;
          }
          return true;
        });
      }, [filters]);

      // Pipeline Step 2: KPIs & Deltas
      const kpis = useMemo(() => {
        // Exclude cancelled orders from recognized revenue
        const revenue = filteredOrders.reduce((sum, o) => o.status !== 'Cancelled' ? sum + o.amount : sum, 0);
        const sales = filteredOrders.reduce((sum, o) => sum + o.quantity, 0);
        const ordersCount = filteredOrders.length;
        const customers = new Set(filteredOrders.map(o => o.customerEmail)).size;

        return {
          revenue,
          sales,
          orders: ordersCount,
          customers,
          revDelta: 14.2,
          salesDelta: 8.5,
          ordersDelta: 11.0,
          custDelta: 6.3
        };
      }, [filteredOrders]);

      // Pipeline Step 3: Chronological chart data
      const chartPoints = useMemo(() => {
        const sorted = [...filteredOrders].sort((a, b) => b.daysAgo - a.daysAgo);
        const groups = {};
        sorted.forEach(o => {
          if (!groups[o.chartLabel]) {
            groups[o.chartLabel] = { label: o.chartLabel, revenue: 0, sales: 0 };
          }
          if (o.status !== 'Cancelled') groups[o.chartLabel].revenue += o.amount;
          groups[o.chartLabel].sales += o.quantity;
        });
        return Object.values(groups);
      }, [filteredOrders]);

      // Pipeline Step 4: Status breakdown
      const statusCounts = useMemo(() => {
        const counts = { Completed: 0, Processing: 0, Pending: 0, Cancelled: 0 };
        filteredOrders.forEach(o => { counts[o.status] = (counts[o.status] || 0) + 1; });
        return counts;
      }, [filteredOrders]);

      // Sorted & Paginated table rows
      const tableRows = useMemo(() => {
        const sorted = [...filteredOrders].sort((a, b) => {
          let va = a[sortField];
          let vb = b[sortField];
          if (typeof va === 'string') {
            va = va.toLowerCase();
            vb = vb.toLowerCase();
          }
          if (va < vb) return sortDir === 'asc' ? -1 : 1;
          if (va > vb) return sortDir === 'asc' ? 1 : -1;
          return 0;
        });
        return sorted.slice(page * rowsPerPage, (page + 1) * rowsPerPage);
      }, [filteredOrders, sortField, sortDir, page, rowsPerPage]);

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDir('asc');
        }
      };

      const handleToggleStatus = (st) => {
        setFilters(prev => {
          const exists = prev.statuses.includes(st);
          if (exists && prev.statuses.length === 1) return prev;
          const updated = exists ? prev.statuses.filter(s => s !== st) : [...prev.statuses, st];
          return { ...prev, statuses: updated };
        });
      };

      const handleReset = () => {
        setFilters({
          dateRange: '30d',
          category: 'ALL',
          statuses: ['Completed', 'Processing', 'Pending', 'Cancelled'],
          searchQuery: ''
        });
        setPage(0);
        showToast('All filters reset to default');
      };

      const handleExportCsv = () => {
        const headers = ['Order ID', 'Customer Name', 'Customer Email', 'Category', 'Date', 'Status', 'Amount ($)', 'Quantity', 'Items'];
        const rows = filteredOrders.map(o => [
          o.id,
          `"${o.customerName}"`,
          o.customerEmail,
          o.category,
          o.dateFormatted,
          o.status,
          o.amount,
          o.quantity,
          `"${o.items.join('; ')}"`
        ]);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const encoded = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encoded);
        link.setAttribute('download', `oms_orders_export_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast(`Exported ${filteredOrders.length} orders to CSV`);
      };

      const isFiltered = filters.dateRange !== '30d' || filters.category !== 'ALL' || filters.statuses.length !== 4 || filters.searchQuery !== '';

      return (
        <div className="container">
          {/* TIER 1: Masthead */}
          <div className="card masthead">
            <div className="brand-wrap">
              <div className="brand-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M3 3v18h18" />
                  <path d="m19 9-5 5-4-4-3 3" />
                </svg>
              </div>
              <div>
                <div className="brand-title">
                  Order Management Analytics
                  <span className="brand-badge">v2.4 Enterprise</span>
                </div>
                <div className="brand-sub">
                  <span>Reporting Period: <strong style={{color: '#334155'}}>{filters.dateRange.toUpperCase()}</strong></span>
                  <span style={{color: '#cbd5e1'}}>•</span>
                  <span>Showing <strong style={{color: '#0f172a'}}>{filteredOrders.length}</strong> of {RAW_ORDERS.length} orders</span>
                </div>
              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
              <div className="sync-badge">
                <div className="sync-dot"></div>
                Live Sync
              </div>

              <button className="btn btn-outline" onClick={handleExportCsv}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7 10 12 15 17 10" />
                  <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Export CSV
              </button>

              <button
                className={`btn ${isFiltered ? 'btn-primary' : 'btn-outline'}`}
                onClick={handleReset}
                disabled={!isFiltered}
              >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
                Reset Filters
              </button>
            </div>
          </div>

          {/* TIER 2: Controls */}
          <div className="card filter-bar">
            <div className="filter-row-top">
              {/* Search */}
              <div className="search-input-wrap">
                <svg className="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                  type="text"
                  className="search-input"
                  placeholder="Search Order ID, Customer, Item..."
                  value={filters.searchQuery}
                  onChange={(e) => setFilters({ ...filters, searchQuery: e.target.value })}
                />
              </div>

              {/* Date Window */}
              <div className="select-wrap">
                <label className="select-label">Date Window</label>
                <select
                  className="select-ctrl"
                  value={filters.dateRange}
                  onChange={(e) => setFilters({ ...filters, dateRange: e.target.value })}
                >
                  <option value="7d">Last 7 Days</option>
                  <option value="30d">Last 30 Days</option>
                  <option value="90d">Last 90 Days</option>
                  <option value="all">All Time</option>
                </select>
              </div>

              {/* Category */}
              <div className="select-wrap">
                <label className="select-label">Product Category</label>
                <select
                  className="select-ctrl"
                  value={filters.category}
                  onChange={(e) => setFilters({ ...filters, category: e.target.value })}
                >
                  <option value="ALL">All Categories</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Apparel">Apparel</option>
                  <option value="Home">Home</option>
                  <option value="Software">Software</option>
                </select>
              </div>
            </div>

            {/* Status Chips */}
            <div className="filter-row-bottom">
              <div className="status-group">
                <span style={{ fontSize: '0.75rem', fontWeight: 600, color: '#64748b', textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                  Order Status:
                </span>
                {['Completed', 'Processing', 'Pending', 'Cancelled'].map(st => {
                  const isSel = filters.statuses.includes(st);
                  const meta = STATUS_META[st];
                  return (
                    <div
                      key={st}
                      className="status-pill-toggle"
                      onClick={() => handleToggleStatus(st)}
                      style={{
                        background: isSel ? meta.bg : '#f8fafc',
                        color: isSel ? meta.text : '#64748b',
                        borderColor: isSel ? meta.border : '#e2e8f0'
                      }}
                    >
                      <span style={{ width: 8, height: 8, borderRadius: '50%', background: isSel ? meta.dot : '#cbd5e1' }}></span>
                      {st}
                    </div>
                  );
                })}
              </div>

              {filters.statuses.length < 4 && (
                <span
                  style={{ fontSize: '0.75rem', color: '#2563eb', fontWeight: 600, cursor: 'pointer', textDecoration: 'underline' }}
                  onClick={() => setFilters({ ...filters, statuses: ['Completed', 'Processing', 'Pending', 'Cancelled'] })}
                >
                  Select All Statuses
                </span>
              )}
            </div>
          </div>

          {/* TIER 3: KPIs */}
          <div className="kpi-grid">
            {/* Total Revenue */}
            <div className="card kpi-card">
              <div className="kpi-header">
                <span className="kpi-title">Total Revenue</span>
                <span className="trend-pill positive tabular-nums">+{kpis.revDelta}%</span>
              </div>
              <div className="kpi-value tabular-nums">{fmtCurrency(kpis.revenue)}</div>
              <div className="kpi-footer">
                <div className="kpi-icon-wrap" style={{ background: '#eff6ff', color: '#2563eb' }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <span className="kpi-subtext">Net recognized income</span>
              </div>
            </div>

            {/* Total Sales Units */}
            <div className="card kpi-card">
              <div className="kpi-header">
                <span className="kpi-title">Total Sales Units</span>
                <span className="trend-pill positive tabular-nums">+{kpis.salesDelta}%</span>
              </div>
              <div className="kpi-value tabular-nums">{fmtNumber(kpis.sales)} units</div>
              <div className="kpi-footer">
                <div className="kpi-icon-wrap" style={{ background: '#f0fdfa', color: '#0d9488' }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                </div>
                <span className="kpi-subtext">Products ordered</span>
              </div>
            </div>

            {/* Total Orders */}
            <div className="card kpi-card">
              <div className="kpi-header">
                <span className="kpi-title">Total Orders</span>
                <span className="trend-pill positive tabular-nums">+{kpis.ordersDelta}%</span>
              </div>
              <div className="kpi-value tabular-nums">{fmtNumber(kpis.orders)}</div>
              <div className="kpi-footer">
                <div className="kpi-icon-wrap" style={{ background: '#f5f3ff', color: '#7c3aed' }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                </div>
                <span className="kpi-subtext">Transactions processed</span>
              </div>
            </div>

            {/* Active Customers */}
            <div className="card kpi-card">
              <div className="kpi-header">
                <span className="kpi-title">Active Customers</span>
                <span className="trend-pill positive tabular-nums">+{kpis.custDelta}%</span>
              </div>
              <div className="kpi-value tabular-nums">{fmtNumber(kpis.customers)}</div>
              <div className="kpi-footer">
                <div className="kpi-icon-wrap" style={{ background: '#fff7ed', color: '#ea580c' }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <span className="kpi-subtext">Unique purchaser accounts</span>
              </div>
            </div>
          </div>

          {/* TIER 4: Analytics (8:4 split) */}
          <div className="analytics-grid">
            {/* Revenue & Sales Line Trend */}
            <div className="card chart-card">
              <div className="chart-header">
                <div className="chart-title-wrap">
                  <h3>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    Revenue & Sales Volume Trend
                  </h3>
                  <p>Chronological aggregation across active filter constraints</p>
                </div>
                <div className="chart-legend-wrap">
                  <div className="legend-item">
                    <div className="legend-bar" style={{ background: '#2563eb' }}></div>
                    Revenue ($)
                  </div>
                  <div className="legend-item">
                    <div className="legend-bar" style={{ background: '#0d9488' }}></div>
                    Sales (Units)
                  </div>
                </div>
              </div>

              {/* Responsive SVG Chart */}
              <div style={{ width: '100%', height: 260, position: 'relative' }}>
                {chartPoints.length === 0 ? (
                  <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#94a3b8' }}>
                    No chart data matching current filters
                  </div>
                ) : (
                  <svg width="100%" height="260" viewBox="0 0 700 260" preserveAspectRatio="none">
                    <defs>
                      <linearGradient id="revGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#2563eb" stopOpacity="0.15" />
                        <stop offset="100%" stopColor="#2563eb" stopOpacity="0.0" />
                      </linearGradient>
                    </defs>
                    {/* Grid lines */}
                    <line x1="40" y1="40" x2="680" y2="40" stroke="#f1f5f9" strokeDasharray="3 3" />
                    <line x1="40" y1="100" x2="680" y2="100" stroke="#f1f5f9" strokeDasharray="3 3" />
                    <line x1="40" y1="160" x2="680" y2="160" stroke="#f1f5f9" strokeDasharray="3 3" />
                    <line x1="40" y1="220" x2="680" y2="220" stroke="#e2e8f0" />

                    {/* Generate path points */}
                    {(() => {
                      const maxRev = Math.max(...chartPoints.map(p => p.revenue), 1000);
                      const maxSales = Math.max(...chartPoints.map(p => p.sales), 10);
                      const n = chartPoints.length;
                      const stepX = (640 / Math.max(n - 1, 1));

                      const revCoords = chartPoints.map((p, idx) => {
                        const x = 50 + idx * stepX;
                        const y = 220 - (p.revenue / maxRev) * 170;
                        return { x, y, p };
                      });

                      const salesCoords = chartPoints.map((p, idx) => {
                        const x = 50 + idx * stepX;
                        const y = 220 - (p.sales / maxSales) * 170;
                        return { x, y, p };
                      });

                      const revPathD = revCoords.reduce((acc, c, idx) => `${acc} ${idx === 0 ? 'M' : 'L'} ${c.x} ${c.y}`, '');
                      const salesPathD = salesCoords.reduce((acc, c, idx) => `${acc} ${idx === 0 ? 'M' : 'L'} ${c.x} ${c.y}`, '');
                      const revAreaD = `${revPathD} L ${revCoords[revCoords.length - 1].x} 220 L ${revCoords[0].x} 220 Z`;

                      return (
                        <g>
                          <path d={revAreaD} fill="url(#revGrad)" />
                          <path d={revPathD} fill="none" stroke="#2563eb" strokeWidth="2.5" />
                          <path d={salesPathD} fill="none" stroke="#0d9488" strokeWidth="2.5" strokeDasharray="4 2" />

                          {revCoords.map((c, i) => (
                            <circle key={`rc-${i}`} cx={c.x} cy={c.y} r="3.5" fill="#2563eb" stroke="#ffffff" strokeWidth="1.5" />
                          ))}
                          {salesCoords.map((c, i) => (
                            <circle key={`sc-${i}`} cx={c.x} cy={c.y} r="3" fill="#0d9488" stroke="#ffffff" strokeWidth="1" />
                          ))}

                          {/* X-axis labels */}
                          {revCoords.filter((_, idx) => idx % Math.ceil(n / 7) === 0 || idx === n - 1).map((c, i) => (
                            <text key={`lbl-${i}`} x={c.x} y="242" textAnchor="middle" fontSize="10" fill="#94a3b8" fontFamily="Inter">
                              {c.p.label}
                            </text>
                          ))}
                        </g>
                      );
                    })()}
                  </svg>
                )}
              </div>
            </div>

            {/* Fulfillment Status Donut */}
            <div className="card chart-card">
              <div className="chart-header">
                <div className="chart-title-wrap">
                  <h3>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10h-10z"/></svg>
                    Fulfillment Breakdown
                  </h3>
                  <p>Proportional status split</p>
                </div>
              </div>

              {/* Donut Chart with Centered Total */}
              <div style={{ position: 'relative', width: '100%', height: 210 }}>
                {filteredOrders.length === 0 ? (
                  <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#94a3b8' }}>
                    No orders to display
                  </div>
                ) : (
                  <>
                    <svg width="100%" height="210" viewBox="0 0 220 210">
                      {(() => {
                        const total = filteredOrders.length;
                        const center = { x: 110, y: 105 };
                        const rOuter = 85;
                        const rInner = 56;
                        let startAngle = 0;

                        return ['Completed', 'Processing', 'Pending', 'Cancelled'].map(st => {
                          const count = statusCounts[st] || 0;
                          if (count === 0) return null;
                          const angle = (count / total) * 360;
                          const endAngle = startAngle + angle;

                          // Polar to Cartesian helper
                          const polar = (deg, r) => {
                            const rad = (deg - 90) * Math.PI / 180.0;
                            return { x: center.x + r * Math.cos(rad), y: center.y + r * Math.sin(rad) };
                          };

                          const p1 = polar(startAngle, rOuter);
                          const p2 = polar(endAngle, rOuter);
                          const p3 = polar(endAngle, rInner);
                          const p4 = polar(startAngle, rInner);
                          const largeArc = angle > 180 ? 1 : 0;

                          const pathData = `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${largeArc} 0 ${p4.x} ${p4.y} Z`;
                          startAngle = endAngle;

                          return (
                            <path
                              key={st}
                              d={pathData}
                              fill={STATUS_META[st].chartColor}
                              stroke="#ffffff"
                              strokeWidth="2"
                              style={{ cursor: 'pointer', transition: 'opacity 0.2s' }}
                              onClick={() => handleToggleStatus(st)}
                            />
                          );
                        });
                      })()}
                    </svg>

                    <div className="donut-center-overlay">
                      <div className="donut-center-num tabular-nums">{filteredOrders.length}</div>
                      <div className="donut-center-lbl">Orders</div>
                    </div>
                  </>
                )}
              </div>

              {/* Status List Legend */}
              <div style={{ marginTop: 'auto', paddingTop: 12, borderTop: '1px solid #f1f5f9' }}>
                {['Completed', 'Processing', 'Pending', 'Cancelled'].map(st => {
                  const count = statusCounts[st] || 0;
                  const pct = filteredOrders.length ? ((count / filteredOrders.length) * 100).toFixed(1) : 0;
                  const meta = STATUS_META[st];
                  return (
                    <div
                      key={st}
                      onClick={() => handleToggleStatus(st)}
                      style={{
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        padding: '4px 8px',
                        borderRadius: 6,
                        cursor: 'pointer',
                        fontSize: '0.8rem'
                      }}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <span style={{ width: 8, height: 8, borderRadius: '50%', background: meta.chartColor }}></span>
                        <span style={{ fontWeight: 600, color: meta.text }}>{st}</span>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <span className="tabular-nums" style={{ fontWeight: 700, color: '#0f172a' }}>{count}</span>
                        <span className="tabular-nums" style={{ color: '#64748b', fontSize: '0.75rem', minWidth: 40, textAlign: 'right' }}>{pct}%</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* TIER 5: Ledger Table */}
          <div className="card table-card">
            <div className="table-header-mast">
              <div>
                <h3 style={{ fontSize: '1rem', fontWeight: 700, display: 'flex', alignItems: 'center', gap: 8, color: '#0f172a' }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                  Order Ledger & Transaction Records
                </h3>
                <p style={{ fontSize: '0.8rem', color: '#64748b', marginTop: 2 }}>
                  Direct drill-down into normalized line items ({filteredOrders.length} records)
                </p>
              </div>
            </div>

            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th onClick={() => handleSort('id')}>Order ID {sortField === 'id' ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>
                    <th onClick={() => handleSort('customerName')}>Customer {sortField === 'customerName' ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>
                    <th onClick={() => handleSort('category')}>Category {sortField === 'category' ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>
                    <th onClick={() => handleSort('daysAgo')}>Order Date {sortField === 'daysAgo' ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>
                    <th onClick={() => handleSort('status')}>Status {sortField === 'status' ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>
                    <th className="num" onClick={() => handleSort('amount')}>Amount ($) {sortField === 'amount' ? (sortDir === 'asc' ? '↑' : '↓') : ''}</th>
                  </tr>
                </thead>
                <tbody>
                  {filteredOrders.length === 0 ? (
                    <tr>
                      <td colSpan="6" style={{ textAlign: 'center', padding: '40px 20px', color: '#94a3b8' }}>
                        No orders match current filter criteria.
                      </td>
                    </tr>
                  ) : (
                    tableRows.map(o => {
                      const sm = STATUS_META[o.status];
                      const cm = CATEGORY_COLORS[o.category] || { bg: '#f1f5f9', text: '#475569', border: '#cbd5e1' };
                      return (
                        <tr key={o.id}>
                          <td>
                            <strong style={{ fontFamily: 'monospace', color: '#2563eb' }}>{o.id}</strong>
                          </td>
                          <td>
                            <div>
                              <div style={{ fontWeight: 600, color: '#0f172a' }}>{o.customerName}</div>
                              <div style={{ fontSize: '0.75rem', color: '#64748b' }}>{o.customerEmail}</div>
                            </div>
                          </td>
                          <td>
                            <span className="cat-chip" style={{ background: cm.bg, color: cm.text, border: `1px solid ${cm.border}` }}>
                              {o.category}
                            </span>
                          </td>
                          <td style={{ color: '#475569', fontSize: '0.825rem' }}>{o.dateFormatted}</td>
                          <td>
                            <span className="status-badge" style={{ background: sm.bg, color: sm.text, border: `1px solid ${sm.border}` }}>
                              <span className="status-badge-dot" style={{ background: sm.dot }}></span>
                              {o.status}
                            </span>
                          </td>
                          <td className="num tabular-nums" style={{ fontWeight: 700, color: o.status === 'Cancelled' ? '#94a3b8' : '#0f172a', textDecoration: o.status === 'Cancelled' ? 'line-through' : 'none' }}>
                            {fmtCurrency(o.amount)}
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            {/* Pagination Controls */}
            <div className="pagination-bar">
              <div>
                Showing {Math.min(filteredOrders.length, page * rowsPerPage + 1)} to {Math.min(filteredOrders.length, (page + 1) * rowsPerPage)} of {filteredOrders.length}
              </div>
              <div className="pagination-ctrls">
                <button
                  className="btn btn-outline"
                  style={{ padding: '4px 10px', fontSize: '0.75rem' }}
                  disabled={page === 0}
                  onClick={() => setPage(page - 1)}
                >
                  Previous
                </button>
                <span>Page {page + 1} of {Math.max(1, Math.ceil(filteredOrders.length / rowsPerPage))}</span>
                <button
                  className="btn btn-outline"
                  style={{ padding: '4px 10px', fontSize: '0.75rem' }}
                  disabled={(page + 1) * rowsPerPage >= filteredOrders.length}
                  onClick={() => setPage(page + 1)}
                >
                  Next
                </button>
              </div>
            </div>
          </div>

          {/* Footer Info */}
          <div style={{ marginTop: 32, paddingTop: 20, borderTop: '1px solid #e2e8f0', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', gap: 12, fontSize: '0.75rem', color: '#94a3b8' }}>
            <span>Order Management Systems (OMS) Analytics Architecture • React 18 & MUI v5 / Recharts</span>
            <span>Unidirectional Reactive Flow Pipeline • 60 FPS Single Source of Truth</span>
          </div>

          {/* Toast */}
          {toast && (
            <div className="toast">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
